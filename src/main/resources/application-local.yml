spring:
  datasource:
    # A dedicated file H2 database; never reuses the production JDBC_DATABASE_URL.
    url: jdbc:h2:file:./.local/demp;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      data-locations: classpath:local/data.sql
  jwt:
    secret: local-only-jwt-secret-not-for-production
cloud:
  aws:
    credentials:
      access-key: local-unused
      secret-key: local-unused
    region:
      static: ap-northeast-2
    s3:
      bucket: local-unused
