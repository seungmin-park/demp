spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # show_sql: true
#        format_sql: true
#        use_sql_comments: true

  jwt:
    secret: ${JWT_SECRET}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  #logging.level:
#  org.hibernate.SQL: debug
  # org.hibernate.type: trace

file:
  dir: C:/repo/dempfrontend/src/assets/
  max-size-bytes: 5242880

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5050}

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ${S3_STATIC}
    s3:
      bucket: ${S3_BUCKET}
      public-base-url: ${S3_PUBLIC_BASE_URL:https://inhatc-demp.s3.ap-northeast-2.amazonaws.com/}
    stack:
      auto: false
