name: DEMP backend CD

on:
  workflow_run:
    workflows: [DEMP CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 현재 main의 성공한 push CI 실행 ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: demp-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEMP_BACKEND_CD_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: 현재 main의 성공한 CI 실행물 준비
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: python3 scripts/prepare_backend_cd.py --run-id "$REQUESTED_RUN"
      - name: 백엔드 전용 WIF 인증
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEMP_BACKEND_WIF_PROVIDER }}
          service_account: ${{ vars.DEMP_BACKEND_CD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: IAP와 제한된 SSH 명령으로 백엔드 배포
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PROJECT: ${{ vars.DEMP_GCP_PROJECT }}
          CD_ZONE: ${{ vars.DEMP_GCP_ZONE }}
          CD_INSTANCE: ${{ vars.DEMP_GCP_INSTANCE }}
          CD_SSH_KEY: ${{ secrets.DEMP_BACKEND_CD_SSH_PRIVATE_KEY }}
          CD_HOST_KEY: ${{ vars.DEMP_SSH_HOST_KEY }}
        run: python3 scripts/run_backend_cd.py
