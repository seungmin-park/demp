spring:
  profiles:
    active: test

  datasource:
    generate-unique-name: true
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # show_sql: true
        format_sql: true
        use_sql_comments: true

  jwt:
    secret: test-only-jwt-secret-not-for-production

logging.level:
  org.hibernate.SQL: debug
  # org.hibernate.type: trace

file:
  dir: C:/repo/dempfrontend/src/assets/
  max-size-bytes: 5242880

cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: demp-test-unused
    stack:
      auto: false
