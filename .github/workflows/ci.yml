name: backend-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Check agent boundaries and official documentation versions
        run: python3 scripts/check_agent_contracts.py
      - name: Run all tests including REST Docs
        run: ./gradlew clean test --console=plain
      - name: Generate API HTML
        run: ./gradlew asciidoctor bootJar --console=plain
      - name: Check generated API document
        run: |
          test -s build/docs/asciidoc/index.html
          if grep -R -n -E 'test-only-jwt-secret|local-only-jwt-secret|test-access-key|test-secret-key' build/docs/asciidoc build/generated-snippets; then
            echo 'Test-only internal credentials appeared in API documentation' >&2
            exit 1
          fi
          if grep -n -E 'Unresolved directive|include::' build/docs/asciidoc/index.html; then
            echo 'API document has unresolved snippets' >&2
            exit 1
          fi
