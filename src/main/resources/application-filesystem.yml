server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
app:
  local:
    upload-dir: ${APP_LOCAL_UPLOAD_DIR:/data/uploads}
cloud:
  aws:
    s3:
      public-base-url: /local-files/
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
